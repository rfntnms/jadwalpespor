<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pestapora 2026 — Jadwal Gua</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --ink:#1d2b28; --muted:#5d6b67; --line:#d9e0d6; --clash:#d8342a; --clash-bg:#fde6e3;
  --card:#ffffff;
  /* day theme (set by JS via data-day) */
  --bg:#f3f8e6; --accent:#12806c; --accent-ink:#ffffff; --hi:#ff5a1f; --soft:#dff0e7;
}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 150px)}
*,*::before,*::after{box-sizing:inherit}
body[data-day="jum"]{--bg:#f3f8e6;--accent:#12806c;--hi:#ff5a1f;--soft:#dcefe5}
body[data-day="sab"]{--bg:#fdeef0;--accent:#6f5fc4;--hi:#27b24a;--soft:#ebe6fb}
body[data-day="min"]{--bg:#eaf3fb;--accent:#1a7fd0;--hi:#ec4f97;--soft:#dcecfa}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--ink:#eef3ef;--muted:#a3b0ab;--line:#33403c;--card:#1b2422;--clash-bg:#3d1f1c}
  :root:not([data-theme="light"]) body[data-day="jum"]{--bg:#0f1a17;--accent:#3fc2a5;--soft:#1c3530}
  :root:not([data-theme="light"]) body[data-day="sab"]{--bg:#17131f;--accent:#a697f2;--soft:#2a2440}
  :root:not([data-theme="light"]) body[data-day="min"]{--bg:#0e1722;--accent:#5fb1ef;--soft:#1b2d42}
}
:root[data-theme="dark"]{--ink:#eef3ef;--muted:#a3b0ab;--line:#33403c;--card:#1b2422;--clash-bg:#3d1f1c}
:root[data-theme="dark"] body[data-day="jum"]{--bg:#0f1a17;--accent:#3fc2a5;--soft:#1c3530}
:root[data-theme="dark"] body[data-day="sab"]{--bg:#17131f;--accent:#a697f2;--soft:#2a2440}
:root[data-theme="dark"] body[data-day="min"]{--bg:#0e1722;--accent:#5fb1ef;--soft:#1b2d42}

html,body{margin:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  font-size:16px; line-height:1.4; min-height:100%;
  transition:background-color .3s;
}
button{font:inherit;color:inherit}
.wrap{max-width:640px;margin:0 auto;padding:0 16px 96px}

header.top{
  position:sticky; top:env(safe-area-inset-top,0px); z-index:10;
  background:var(--bg); padding:14px 0 10px; margin:0 -16px; padding-left:16px; padding-right:16px;
  border-bottom:2px solid var(--line);
}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.brand h1{
  font-family:"Bagel Fat One","Arial Rounded MT Bold","Trebuchet MS",sans-serif;
  font-weight:400; font-size:34px; line-height:1; margin:0; color:var(--accent);
  letter-spacing:-.5px; -webkit-text-stroke:0; text-shadow:3px 3px 0 var(--soft);
}
.brand .date{font-size:13px;color:var(--muted);text-align:right}

.days{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:12px}
.day{
  border:2px solid var(--line); background:var(--card); border-radius:14px;
  padding:8px 4px; cursor:pointer; text-align:center; line-height:1.15;
}
.day b{display:block;font-size:15px}
.day span{font-size:12px;color:var(--muted)}
.day[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.day[aria-pressed="true"] span{color:#fff;opacity:.85}

.views{display:flex;gap:6px;margin-top:10px}
.view{
  flex:1; border:0; background:transparent; padding:8px 6px; border-radius:10px; cursor:pointer;
  font-weight:600; color:var(--muted);
}
.view[aria-pressed="true"]{background:var(--soft);color:var(--ink)}
.count{
  display:inline-block;min-width:22px;padding:0 6px;border-radius:11px;margin-left:4px;
  background:var(--hi);color:#fff;font-size:12px;line-height:20px;font-weight:800;
}

.tools{display:flex;gap:8px;margin:14px 0 8px}
.search{
  flex:1; min-width:0; border:2px solid var(--line); background:var(--card); color:var(--ink);
  border-radius:12px; padding:10px 12px; font:inherit;
}
.search:focus{outline:none;border-color:var(--accent)}
.chips{display:flex;gap:6px;overflow-x:auto;padding:4px 0 10px;scrollbar-width:none;margin:0 -16px;padding-left:16px;padding-right:16px}
.chips::-webkit-scrollbar{display:none}
.chip{
  flex:none; border:1.5px solid var(--line); background:var(--card); border-radius:999px;
  padding:5px 11px; font-size:13px; cursor:pointer; white-space:nowrap;
}
.chip[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--bg)}
.chip i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:1px}

.hour{
  font-family:"Bagel Fat One","Arial Rounded MT Bold",sans-serif; font-size:22px; color:var(--accent);
  margin:18px 0 6px; display:flex; align-items:center; gap:10px;
}
.hour::after{content:"";flex:1;height:2px;background:var(--line)}

.act{
  display:grid; grid-template-columns:62px 1fr 44px; align-items:center; gap:10px;
  background:var(--card); border:2px solid var(--line); border-radius:14px;
  padding:10px 10px 10px 12px; margin-bottom:6px; cursor:pointer; width:100%; text-align:left;
  transition:border-color .15s, background-color .15s;
}
.act:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.act .t{font-variant-numeric:tabular-nums;font-size:14px;line-height:1.2;font-weight:600}
.act .t small{display:block;font-weight:400;color:var(--muted)}
.act .n{font-weight:800;font-size:16px;line-height:1.2}
.act .s{font-size:13px;color:var(--muted);margin-top:2px}
.act .s i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:0}
.act .warn{font-size:12px;color:var(--clash);margin-top:3px;font-weight:600}
.pick{
  width:36px;height:36px;border-radius:50%;border:2px solid var(--line);justify-self:end;
  display:grid;place-items:center;font-size:18px;line-height:1;color:transparent;
}
.act.on{border-color:var(--accent);background:var(--soft)}
.act.on .pick{background:var(--accent);border-color:var(--accent);color:#fff}

.empty{text-align:center;padding:48px 16px;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:18px;margin-bottom:6px}

/* my schedule */
.summary{
  display:flex;flex-wrap:wrap;gap:8px 16px;margin:14px 0 4px;font-size:14px;color:var(--muted)
}
.summary strong{color:var(--ink)}
.summary .bad strong{color:var(--clash)}
.gap{font-size:13px;color:var(--muted);padding:4px 0 8px 74px}
.clash-group{
  border:2px dashed var(--clash); background:var(--clash-bg); border-radius:16px;
  padding:10px 8px 4px; margin:6px 0 10px;
}
.clash-group > p{margin:0 4px 8px;font-size:13px;font-weight:700;color:var(--clash)}
.mine .act{cursor:default}
.mine .x{
  width:36px;height:36px;border-radius:50%;border:2px solid var(--line);background:transparent;
  cursor:pointer;justify-self:end;font-size:16px;color:var(--muted)
}
.mine .act.now{box-shadow:0 0 0 3px var(--hi)}
.mine .act.past{opacity:.5}
.tag-now{display:inline-block;background:var(--hi);color:#fff;border-radius:6px;font-size:11px;font-weight:800;padding:1px 6px;margin-left:6px;vertical-align:2px}

.actions{display:flex;gap:8px;margin-top:18px}
.btn{
  flex:1;border:2px solid var(--ink);background:var(--ink);color:var(--bg);border-radius:12px;
  padding:11px 10px;font-weight:700;cursor:pointer
}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.toast{
  position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);
  background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;
  opacity:0;pointer-events:none;transition:.25s;max-width:90%
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

</div>

const DAY_INFO = {
  jum:{label:"Jumat, 25 Sept", date:"2026-09-25"},
  sab:{label:"Sabtu, 26 Sept", date:"2026-09-26"},
  min:{label:"Minggu, 27 Sept", date:"2026-09-27"}
};
const STAGE_COLORS = ["#ff5a1f","#12806c","#6f5fc4","#e0a100","#ec4f97","#1a7fd0","#2aa84a","#b5582b","#8e44ad",
  "#00a3a3","#d8342a","#5c7cfa","#9c6f00","#c2185b","#00897b","#7b5e57","#3949ab","#f06292","#558b2f"];

const toMin = t => { let [h,m] = t.split(":").map(Number); if (h < 14) h += 24; return h*60+m; };
const fmt = t => t.replace(":", ".");
const durTxt = m => m >= 60 ? (Math.floor(m/60)+" jam"+(m%60?" "+(m%60)+" mnt":"")) : m+" mnt";

// Build acts
const ACTS = {};
const STAGES = {};
for (const d of Object.keys(RAW)) {
  const order = [];
  ACTS[d] = RAW[d].map(([stage,s,e,name]) => {
    if (!order.includes(stage)) order.push(stage);
    return {id:`${d}|${stage}|${s}|${name}`, day:d, stage, s, e, name, a:toMin(s), b:toMin(e)};
  }).sort((x,y) => x.a - y.a || x.stage.localeCompare(y.stage));
  STAGES[d] = order;
}
const allStages = [...new Set(Object.values(STAGES).flat())];
const stageColor = st => STAGE_COLORS[allStages.indexOf(st) % STAGE_COLORS.length];

// State + storage
const KEY = "pestapora2026:picks";
let picks = new Set();
try { const v = localStorage.getItem(KEY); if (v) picks = new Set(JSON.parse(v)); } catch(e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify([...picks])); } catch(e) {} };
let ui = {day:"jum", view:"all", q:"", stage:null};
try { const u = JSON.parse(localStorage.getItem(KEY+":ui")||"null"); if (u) ui = {...ui, day:u.day||"jum", view:u.view||"all"}; } catch(e) {}
const saveUi = () => { try { localStorage.setItem(KEY+":ui", JSON.stringify({day:ui.day, view:ui.view})); } catch(e) {} };

const overlaps = (x,y) => x.a < y.b && y.a < x.b;
const picked = d => ACTS[d].filter(a => picks.has(a.id));
const esc = s => s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

// "Now" in Jakarta time, mapped onto festival day minutes
function nowInfo() {
  try {
    const parts = new Intl.DateTimeFormat("en-CA",{timeZone:"Asia/Jakarta",year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",hour12:false}).formatToParts(new Date());
    const g = t => parts.find(p => p.type===t).value;
    let date = `${g("year")}-${g("month")}-${g("day")}`, h = +g("hour") % 24, m = +g("minute");
    if (h < 6) { // after midnight belongs to previous festival day
      const dt = new Date(date+"T00:00:00Z"); dt.setUTCDate(dt.getUTCDate()-1);
      date = dt.toISOString().slice(0,10); h += 24;
    }
    const day = Object.keys(DAY_INFO).find(k => DAY_INFO[k].date === date);
    return day ? {day, min:h*60+m} : null;
  } catch(e) { return null; }
}

function render() {
  document.body.dataset.day = ui.day;
  document.querySelectorAll(".day").forEach(b => b.setAttribute("aria-pressed", b.dataset.day===ui.day));
  document.querySelectorAll(".view").forEach(b => b.setAttribute("aria-pressed", b.dataset.view===ui.view));
  document.getElementById("count").textContent = picked(ui.day).length;
  ui.view === "all" ? renderAll() : renderMine();
}

function actRow(a, opts={}) {
  const on = picks.has(a.id);
  const warn = opts.warn ? `<div class="warn">Bentrok dengan ${esc(opts.warn)}</div>` : "";
  return `<button class="act ${on?"on":""}" data-id="${esc(a.id)}" aria-pressed="${on}" aria-label="${esc(a.name)}, ${fmt(a.s)} sampai ${fmt(a.e)}, ${esc(a.stage)}">
    <div class="t">${fmt(a.s)}<small>${fmt(a.e)}</small></div>
    <div><div class="n">${esc(a.name)}</div><div class="s"><i style="background:${stageColor(a.stage)}"></i>${esc(a.stage)}</div>${warn}</div>
    <div class="pick" aria-hidden="true">✓</div>
  </button>`;
}

function renderAll() {
  const main = document.getElementById("main");
  const q = ui.q.trim().toLowerCase();
  const mine = picked(ui.day);
  let list = ACTS[ui.day].filter(a =>
    (!ui.stage || a.stage === ui.stage) &&
    (!q || a.name.toLowerCase().includes(q) || a.stage.toLowerCase().includes(q)));

  const stagesHere = STAGES[ui.day];
  if (ui.stage && !stagesHere.includes(ui.stage)) ui.stage = null;

  let html = `<div class="tools"><input class="search" id="q" type="search" placeholder="Cari band atau stage" value="${esc(ui.q)}" autocomplete="off"></div>
  <div class="chips" role="group" aria-label="Filter stage">
    <button class="chip" data-stage="" aria-pressed="${!ui.stage}">Semua stage</button>
    ${stagesHere.map(s => `<button class="chip" data-stage="${esc(s)}" aria-pressed="${ui.stage===s}"><i style="background:${stageColor(s)}"></i>${esc(s)}</button>`).join("")}
  </div>`;

  if (!list.length) {
    html += `<div class="empty"><b>Nggak ada yang cocok</b>Coba kata kunci lain atau pilih "Semua stage".</div>`;
  } else {
    let lastHour = null;
    for (const a of list) {
      const hr = Math.floor(a.a/60) % 24;
      if (hr !== lastHour) { html += `<div class="hour">${String(hr).padStart(2,"0")}.00</div>`; lastHour = hr; }
      let warn = null;
      if (!picks.has(a.id)) {
        const c = mine.find(p => overlaps(p,a));
        if (c) warn = c.name;
      }
      html += actRow(a, {warn});
    }
  }
  const prevFocus = document.activeElement && document.activeElement.id === "q";
  const caret = prevFocus ? document.activeElement.selectionStart : null;
  main.innerHTML = html;
  if (prevFocus) { const el = document.getElementById("q"); el.focus(); try{el.setSelectionRange(caret,caret);}catch(e){} }
}

function renderMine() {
  const main = document.getElementById("main");
  const list = picked(ui.day);
  if (!list.length) {
    main.innerHTML = `<div class="empty"><b>Belum ada pilihan buat ${DAY_INFO[ui.day].label}</b>Buka "Semua penampil", lalu tap band yang mau lu tonton.</div>`;
    return;
  }
  // group overlapping picks into clusters
  const groups = [];
  for (const a of list) {
    const g = groups[groups.length-1];
    if (g && a.a < g.end) { g.items.push(a); g.end = Math.max(g.end, a.b); }
    else groups.push({items:[a], start:a.a, end:a.b});
  }
  const clashes = groups.filter(g => g.items.length > 1).length;
  const total = list.reduce((t,a) => t + (a.b-a.a), 0);
  const now = nowInfo();

  let html = `<div class="summary">
    <span><strong>${list.length}</strong> penampil</span>
    <span><strong>${fmt(list[0].s)}–${fmt(list.reduce((m,a)=>a.b>m.b?a:m).e)}</strong></span>
    <span><strong>${durTxt(total)}</strong> total musik</span>
    <span class="${clashes?"bad":""}"><strong>${clashes}</strong> bentrok</span>
  </div><div class="mine">`;

  let prevEnd = null;
  for (const g of groups) {
    if (prevEnd !== null && g.start > prevEnd) html += `<div class="gap">Jeda ${durTxt(g.start - prevEnd)}</div>`;
    const rows = g.items.map(a => {
      let cls = "";
      let tag = "";
      if (now && now.day === ui.day) {
        if (now.min >= a.a && now.min < a.b) { cls = "now"; tag = `<span class="tag-now">Lagi main</span>`; }
        else if (now.min >= a.b) cls = "past";
      }
      return `<div class="act on ${cls}">
        <div class="t">${fmt(a.s)}<small>${fmt(a.e)}</small></div>
        <div><div class="n">${esc(a.name)}${tag}</div><div class="s"><i style="background:${stageColor(a.stage)}"></i>${esc(a.stage)}</div></div>
        <button class="x" data-remove="${esc(a.id)}" aria-label="Hapus ${esc(a.name)}">✕</button>
      </div>`;
    }).join("");
    html += g.items.length > 1
      ? `<div class="clash-group"><p>Bentrok, pilih salah satu atau nonton sebagian</p>${rows}</div>`
      : rows;
    prevEnd = Math.max(prevEnd ?? 0, g.end);
  }
  html += `</div><div class="actions">
    <button class="btn" id="copy">Salin jadwal</button>
    <button class="btn ghost" id="clear">Kosongkan hari ini</button>
  </div>`;
  main.innerHTML = html;
}

function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove("show"), 1800);
}

document.addEventListener("click", e => {
  const day = e.target.closest(".day");
  if (day) { ui.day = day.dataset.day; ui.stage = null; saveUi(); render(); window.scrollTo(0,0); return; }
  const view = e.target.closest(".view");
  if (view) { ui.view = view.dataset.view; saveUi(); render(); window.scrollTo(0,0); return; }
  const chip = e.target.closest(".chip");
  if (chip) { ui.stage = chip.dataset.stage || null; render(); return; }
  const rm = e.target.closest("[data-remove]");
  if (rm) { picks.delete(rm.dataset.remove); save(); render(); toast("Dihapus dari jadwal"); return; }
  const act = e.target.closest("button.act");
  if (act) {
    const id = act.dataset.id;
    if (picks.has(id)) { picks.delete(id); toast("Dihapus dari jadwal"); }
    else { picks.add(id); toast("Ditambahkan ke jadwal"); }
    save(); render(); return;
  }
  if (e.target.id === "copy") {
    const list = picked(ui.day);
    const txt = `Pestapora — ${DAY_INFO[ui.day].label}\n` + list.map(a => `${fmt(a.s)}–${fmt(a.e)}  ${a.name} (${a.stage})`).join("\n");
    const done = () => toast("Jadwal disalin");
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(done, () => fallbackCopy(txt));
    else fallbackCopy(txt);
    return;
  }
  if (e.target.id === "clear") {
    if (confirm(`Kosongkan semua pilihan ${DAY_INFO[ui.day].label}?`)) {
      picked(ui.day).forEach(a => picks.delete(a.id)); save(); render(); toast("Jadwal hari ini dikosongkan");
    }
  }
});
function fallbackCopy(txt) {
  const ta = document.createElement("textarea"); ta.value = txt; ta.style.position="fixed"; ta.style.opacity="0";
  document.body.appendChild(ta); ta.select();
  try { document.execCommand("copy"); toast("Jadwal disalin"); } catch(e) { toast("Gagal menyalin"); }
  ta.remove();
}
document.addEventListener("input", e => { if (e.target.id === "q") { ui.q = e.target.value; renderAll(); } });

// Open on today's festival day if it's during the festival
const n = nowInfo(); if (n) ui.day = n.day;
render();
setInterval(() => { if (ui.view === "mine") render(); }, 60000);
</script>
</body>
</html>
